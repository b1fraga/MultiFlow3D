name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [fusion-forests-project]
  push:
    branches: [fusion-forests-project]


permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: |
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - run: |
          make